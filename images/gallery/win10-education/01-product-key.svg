      <circle cx="200" cy="880" r="5" opacity="0.4"/><circle cx="840" cy="900" r="7" opacity="0.4"/>
    </g>
  <!-- ambient halo behind card -->
  <ellipse cx="512" cy="520" rx="330" ry="330" fill="#1a8dff" opacity="0.20" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <rect x="222" y="150" width="580" height="724" rx="34" fill="#0a1428" stroke="url(#borderGrad)" stroke-width="2"/>
    <rect x="222" y="150" width="580" height="724" rx="34" fill="url(#glass)"/>
    <rect x="222" y="150" width="580" height="240" rx="34" fill="url(#cyanDeep)" opacity="0.16"/>
