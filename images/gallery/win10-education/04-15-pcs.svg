
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#153a6b"/>
      <stop offset="45%" stop-color="#0b1e3c"/>
      <stop offset="100%" stop-color="#040916"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#49e3ff"/>
      <stop offset="100%" stop-color="#0f6dff"/>
    </linearGradient>
    <linearGradient id="cyanDeep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#083a8f"/>
      <stop offset="100%" stop-color="#22c7ff"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fd6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a5cff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#02060f" flood-opacity="0.75"/>
    </filter>
    <filter id="shadowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02060f" flood-opacity="0.6"/>
    </filter>
  </defs>

    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <ellipse cx="512" cy="250" rx="520" ry="420" fill="#2f9bff" opacity="0.14" filter="url(#blur)"/>
    <ellipse cx="150" cy="840" rx="380" ry="300" fill="#0a6bff" opacity="0.16" filter="url(#blur)"/>
    <ellipse cx="900" cy="860" rx="340" ry="280" fill="#22d3ee" opacity="0.12" filter="url(#blur)"/>
    <g fill="#7ce7ff" filter="url(#blur)">
      <circle cx="120" cy="160" r="7" opacity="0.5"/><circle cx="300" cy="120" r="4" opacity="0.4"/>
      <circle cx="760" cy="180" r="6" opacity="0.45"/><circle cx="900" cy="120" r="4" opacity="0.4"/>
      <circle cx="200" cy="880" r="5" opacity="0.4"/><circle cx="840" cy="900" r="7" opacity="0.4"/>
    </g>
  <ellipse cx="512" cy="520" rx="360" ry="340" fill="#0e7bff" opacity="0.18" filter="url(#blur)"/>

  <!-- connection lines -->
  <g stroke="#2f9bff" stroke-width="2" opacity="0.55" stroke-dasharray="4 8">
    <line x1="512" y1="512" x2="512" y2="220"/>
    <line x1="512" y1="512" x2="220" y2="300"/>
    <line x1="512" y1="512" x2="804" y2="300"/>
    <line x1="512" y1="512" x2="176" y2="620"/>
    <line x1="512" y1="512" x2="848" y2="620"/>
    <line x1="512" y1="512" x2="300" y2="820"/>
    <line x1="512" y1="512" x2="724" y2="820"/>
  </g>

  <!-- devices -->
  <rect x="452" y="150" width="120" height="74.4" rx="8.4" fill="url(#cyan)"/><rect x="437.6" y="228" width="148.8" height="14.399999999999999" rx="4.8" fill="#1d4ed8"/>  <circle cx="512" cy="220" r="9" fill="#49e3ff" opacity="0.85" filter="url(#glow)"/>
  <rect x="150" y="238" width="96" height="59.519999999999996" rx="6.720000000000001" fill="#12233f"/><rect x="138.48" y="300.4" width="119.03999999999999" height="11.52" rx="3.84" fill="#0c1a33"/>  <circle cx="220" cy="300" r="9" fill="#49e3ff" opacity="0.85" filter="url(#glow)"/>
  <rect x="700" y="238" width="96" height="59.519999999999996" rx="6.720000000000001" fill="#12233f"/><rect x="688.48" y="300.4" width="119.03999999999999" height="11.52" rx="3.84" fill="#0c1a33"/>  <circle cx="804" cy="300" r="9" fill="#49e3ff" opacity="0.85" filter="url(#glow)"/>
  <rect x="112" y="566" width="96" height="59.519999999999996" rx="6.720000000000001" fill="#12233f"/><rect x="100.48" y="628.4" width="119.03999999999999" height="11.52" rx="3.84" fill="#0c1a33"/>  <circle cx="176" cy="620" r="9" fill="#49e3ff" opacity="0.85" filter="url(#glow)"/>
  <rect x="770" y="566" width="96" height="59.519999999999996" rx="6.720000000000001" fill="#12233f"/><rect x="758.48" y="628.4" width="119.03999999999999" height="11.52" rx="3.84" fill="#0c1a33"/>  <circle cx="848" cy="620" r="9" fill="#49e3ff" opacity="0.85" filter="url(#glow)"/>
  <rect x="240" y="768" width="96" height="59.519999999999996" rx="6.720000000000001" fill="#12233f"/><rect x="228.48" y="830.4" width="119.03999999999999" height="11.52" rx="3.84" fill="#0c1a33"/>  <circle cx="300" cy="820" r="9" fill="#49e3ff" opacity="0.85" filter="url(#glow)"/>
  <rect x="650" y="768" width="96" height="59.519999999999996" rx="6.720000000000001" fill="#12233f"/><rect x="638.48" y="830.4" width="119.03999999999999" height="11.52" rx="3.84" fill="#0c1a33"/>  <circle cx="724" cy="820" r="9" fill="#49e3ff" opacity="0.85" filter="url(#glow)"/>

  <!-- center license card -->
  <g filter="url(#glow)">
    <rect x="392" y="442" width="240" height="140" rx="24" fill="url(#cyan)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="392" y="442" width="240" height="140" rx="24" fill="#0b57d0" stroke="#7ce7ff" stroke-width="2"/>
  </g>
  <rect x="464" y="462" width="26.04" height="26.04" rx="11.200000000000001" fill="url(#cyan)" filter="url(#shadowSoft)"/><rect x="493.96000000000004" y="462" width="26.04" height="26.04" rx="11.200000000000001" fill="#1a8dff" filter="url(#shadowSoft)"/><rect x="464" y="491.96000000000004" width="26.04" height="26.04" rx="11.200000000000001" fill="#3fd0ff" filter="url(#shadowSoft)"/><rect x="493.96000000000004" y="491.96000000000004" width="26.04" height="26.04" rx="11.200000000000001" fill="#0b57d0" filter="url(#shadowSoft)"/>
  <text x="512" y="560" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Windows 10 Education</text>

  <!-- bottom legend -->
  
    <rect x="280" y="648" width="200" height="64" rx="32" fill="url(#glass)" stroke="url(#borderGrad)" stroke-width="1.4"/>
    <text x="380" y="680" text-anchor="middle" dominant-baseline="central"
      font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="30" font-weight="600" fill="#e6f7ff">1 License</text>
  
    <rect x="544" y="648" width="200" height="64" rx="32" fill="url(#glass)" stroke="url(#borderGrad)" stroke-width="1.4"/>
    <text x="644" y="680" text-anchor="middle" dominant-baseline="central"
      font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="32" font-weight="600" fill="#e6f7ff">15 PCs</text>

  <rect x="380" y="760" width="264" height="3" rx="1.5" fill="url(#cyan)" opacity="0.55"/>
  <text x="512" y="830" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', 'Segoe UI Variable', Arial, sans-serif" font-size="34" font-weight="500" fill="#7fd7ff">One key covers all devices</text>
</svg>