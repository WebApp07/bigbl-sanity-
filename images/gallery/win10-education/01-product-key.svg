  <rect x="380" y="540" width="264" height="3" rx="1.5" fill="url(#cyan)" opacity="0.55"/>

  
    <rect x="302" y="578" width="200" height="64" rx="32" fill="url(#glass)" stroke="url(#borderGrad)" stroke-width="1.4"/>
