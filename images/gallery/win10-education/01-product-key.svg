
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#153a6b"/>
      <stop offset="45%" stop-color="#0b1e3c"/>
      <stop offset="100%" stop-color="#040916"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#49e3ff"/>
      <stop offset="100%" stop-color="#0f6dff"/>
    </linearGradient>
    <linearGradient id="cyanDeep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#083a8f"/>
      <stop offset="100%" stop-color="#22c7ff"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fd6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a5cff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#02060f" flood-opacity="0.75"/>
    </filter>
    <filter id="shadowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02060f" flood-opacity="0.6"/>
    </filter>
  </defs>

    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <ellipse cx="512" cy="250" rx="520" ry="420" fill="#2f9bff" opacity="0.14" filter="url(#blur)"/>
    <ellipse cx="150" cy="840" rx="380" ry="300" fill="#0a6bff" opacity="0.16" filter="url(#blur)"/>
    <ellipse cx="900" cy="860" rx="340" ry="280" fill="#22d3ee" opacity="0.12" filter="url(#blur)"/>
    <g fill="#7ce7ff" filter="url(#blur)">
